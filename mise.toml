[settings]
lockfile_mode = "generate"
lockfile = true
experimental = true

[vars]
ver = "v0.0.2"
registry = "forge.larkspur.casa/theendbeta"
image_name = "sandbox"
tag = "{{ vars.registry }}/{{ vars.image_name }}:{{ vars.ver }}"

base_registry = "{{ vars.registry }}"
base_image_name = "{{ vars.image_name }}-base"
base_tag = "{{ vars.base_registry }}/{{ vars.base_image_name }}:{{ vars.ver }}"

oci_dir = "mise-oci"
sbx_name = "sbx-sandbox"

[oci]
tag = "{{ vars.tag }}"
user = "1000:1000"
user_id = 1000

[tools]
eza = "latest"
fd = "latest"
jq = "latest"
just = "latest"
ripgrep = "latest"
shellcheck = "latest"
tmux = "latest"
yq = "latest"
github-cli = "latest"
glab = "latest"
neovim = "latest"

"github:Kilo-Org/kilocode" = "7.8"

[tools."github:superradcompany/microsandbox"]
version = "0.8"

[tasks.registry-login]
description = "Log into registry {{ vars.registry }}"
run = "podman login {{ vars.registry }}"

[tasks.base-build]
description = "Build the base image for the sandbox - {{ vars.base_tag }}"
run = "podman build -f ./base/Containerfile -t {{ vars.base_tag }}"
sources = ["base/**"]

[tasks.base-push]
description = "Push the base image for the sandbox - {{ vars.base_tag }}"
depends = ["base-build"]
run = "podman push {{ vars.base_tag }}"

[tasks.sbx-build]
description = "Build the tooled sandbox image - {{ vars.tag }}"
outputs = ["{{ vars.oci_dir }}"]
run = "mise oci build --from {{ vars.base_tag }}"
wait_for = ["base-build", "base-push"]

[tasks.sbx-load]
description = "Load the tooled sandbox image into podman - {{ vars.tag }}"
depends = ["sbx-build"]
run = "podman image load --input={{ vars.oci_dir }}/"

[tasks.sbx-run]
description = "Run the tooled sandbox image directly - {{ vars.tag }}"
depends = ["sbx-build"]
run = "mise oci run --image-dir {{ vars.oci_dir }}/ -it -- /bin/fish"

[tasks.sbx-push]
description = "Push the tooled sandbox image - {{ vars.tag }}"
depends = ["sbx-build"]
run = "mise oci push --image-dir {{ vars.oci_dir }}/ {{ vars.tag }}"

[tasks.msb-run]
description = "Run the sandbox as microvm - {{ vars.sbx_name }}"
env = { "MSB_CONFIG_PATH" = "$HOME/.config/microsandbox/config.json" }
usage = '''
flag "--replace" help="Force recreate sandbox"
'''
run = '''
msb run \
  --conf=sandbox.yml \
  {{ "--replace" if usage.replace else "" }} \
  --name {{ vars.sbx_name }}
'''

[tasks.msb-start]
description = "Run the sandbox microvm (if exists) - {{ vars.sbx_name }}"
run = "msb start {{ vars.sbx_name }}"

[tasks.msb-rm]
description = "Remove the sandbox microvm (if exists) - {{ vars.sbx_name }}"
env = { "MSB_CONFIG_PATH" = "$HOME/.config/microsandbox/config.json" }
run = "msb rm {{ vars.sbx_name }}"

[tasks.msb-stop]
description = "Remove the sandbox microvm (if exists) - {{ vars.sbx_name }}"
env = { "MSB_CONFIG_PATH" = "$HOME/.config/microsandbox/config.json" }
run = "msb stop {{ vars.sbx_name }}"

[tasks.full-build]
description = "Full build of base through tooled sandbox"
depends = "base-push"
depends_post = "sbx-push"
