image: "localhost:5000/sandbox:v0.0.1"
pull_policy: always
cpus: 4
memory: "4G"

hostname: "sbx-base"
workdir: "/workspace"
user: "sbx"
shell: "/bin/fish"
cmd: ["/bin/fish"]

network:
  policy: public
  deny: ["[::/0]"]
  dns:
    rebind_protection: true

mounts:
  - bind: "./"
    target: "/workspace/app"
  - named: "sbx-config"
    target: "/home/sbx/.config"
    create: ensure-exists
    uid: 1000
    gid: 1000
  - bind: "${HOME}/.config/nvim"
    target: "/home/sbx/.config/nvim"
    readonly: true
  - bind: "${HOME}/.config/tmux"
    target: "/home/sbx/.config/tmux"
    readonly: true
  - bind: "${HOME}/.ssh/kilo-sbx"
    target: "/home/sbx/.ssh"
    readonly: true

  # repo/instance specific
  - named: "sbx-kilo-data"
    target: "/home/sbx/.local/share/kilo"
    create: ensure-exists
    uid: 1000
    gid: 1000
